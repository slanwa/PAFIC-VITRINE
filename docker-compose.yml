services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pafic-app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/storage
      - ./database:/var/www/database
    networks:
      - pafic

  nginx:
    image: nginx:alpine
    container_name: pafic-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pafic

networks:
  pafic:
    driver: bridge
